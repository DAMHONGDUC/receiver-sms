# Template for env/key.properties (gitignored): signing keys for debug and release.
# Copy this file to key.properties and fill in the values. Keep the keystores inside env/ too. Never commit real values.

# Debug keystore, relative to env/ (e.g. debug.keystore; the standard Android debug key uses alias androiddebugkey)
DEBUG_STORE_FILE=
DEBUG_STORE_PASSWORD=
DEBUG_KEY_ALIAS=
DEBUG_KEY_PASSWORD=

# Release keystore, relative to env/ (e.g. release.jks)
RELEASE_STORE_FILE=
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=
